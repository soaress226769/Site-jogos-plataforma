<!DOCTYPE html>
<html lang="por-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone</title>

     <style>
          
          body{
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #090c14;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;

          }

          .login{
            background-color: #111827;
            width: 350px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(142,197,255,0.3);
            text-align: center;
          }

          h1{ 
            color: #8ec5ff;
            font-family: "Cinzel", serif;
            font-optical-sizing: auto;
            font-weight: weight;
            font-style: normal; 
            font-size: 45px;
           }


          p{ color: whitesmoke;
          font-family: "Cinzel", serif;
          font-optical-sizing: auto;
          font-weight:bold;
          font-style: normal;
          }
          
          input{
          width: 100%;
          padding: 12px;
          margin-bottom: 15px;
          border-radius: 8px;
          box-sizing: border-box;

          background-color: #1f2937;
          color: white;
          border: 1px solid #374151;
          }

          button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3b82f6;
            font-weight: bold;
            cursor: pointer;
            font-size: 20px;
            font-family: "Cinzel", serif;
            font-optical-sizing: auto;
            font-weight:bold;
            font-style: normal;
          }

          button:hover{
            background: #0004d4;
          }

          a{
            text-decoration: none;
            color: #8ec5ff;
            font-family: "Cinzel", serif;
            font-optical-sizing: auto;
            font-weight:bold;
            font-style: normal;
          }          
          








     </style>

</head>
<body>
    
<div class="login">

     <h1>⚔️ SkyBound ⚔️</h1>

     <p>Entre no Reino das Plataformas!</p>

     <form action="home.html">

          <input type="email" placeholder="Digite o seu email">

          <input type="password" placeholder="Digite a sua senha">

          <button type="submit"> Entrar </button>


     </form>

     <p>
        <a href="#">Criar conta</a>
     </p>

</div>


</body>
</html>
