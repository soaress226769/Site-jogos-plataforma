<!DOCTYPE html>
<html lang="por-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuphead</title>

    <style>

        body{
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background-color: #090c14;
        color: whitesmoke;
        font-family: "Cinzel", serif;
        font-optical-sizing: auto;
        font-style: normal;
      }

      header{
        background-color: #111827;
        padding: 20px;
        text-align: center;
        border-bottom: 3px solid #8ec5ff;
      }

      header h1{
       color: #8ec5ff;
       transition: 0.3s;
      }

      header h1:hover{
      text-shadow: 0 0 15px #8ec5ff;
      }

      nav{
        text-align: center;
        padding: 15px;
      }

      nav a{
       color: whitesmoke;
       text-decoration: none;
       margin: 15px;
       font-weight: bold;
       transition: 0.3s;
       display: inline-block;
      }

      nav a:hover{
       color: #8ec5ff;
       transform: translateY(-2px);
      }

      #game{
        display:flex;
        justify-content:center;
        gap:20px;
        flex-wrap:wrap;
        padding:30px;
      }

      .btn-game{
        margin-top:20px;
        background-color:#034261;
        color:white;
        padding:12px 25px;
        border-radius:8px;
        font-size:16px;
        font-weight:bold;
        text-decoration:none;
        display:inline-block;
        transition:all 0.3s ease;
      }

      .btn-game:hover{
        background-color:#236a8b;
        color:white;
        box-shadow:0px 0px 20px #072b4a;
        transform:translateY(-2px);
      }

      .btn-game:active{
        transform:scale(0.98);
      }

      .card img{
        width:100%;
        max-height:250px;
        object-fit:cover;
        border-radius:10px;
      }

      .card{
        width:350px;
        max-width:90%;
        margin:auto;
        text-align:center;
        background-color:#111827;
        padding:20px;
        border-radius:10px;
        transition:0.3s;
      }

      .card:hover{
        transform:translateY(-5px);
        box-shadow:0 0 20px rgba(142,197,255,0.3);
      }

      h2{
        color:#8ec5ff;
      }

    </style>
</head>
<body>

    <header>
      <h1>⚔️ SkyBound ⚔️</h1>
    </header>

    <nav>
      <a href="./home.html">Início</a>
      <a href="./home.html#jogos">Jogos</a>
      <a href="./home.html#ranking">Ranking</a>
      <a href="./login.html">Sair</a>
    </nav>

    <section id="game">

        <div class="card">

            <img src="./img/CupHead.jpg" alt="Cuphead">

            <h2>Cuphead</h2>

            <a href="https://www.youtube.com/watch?v=QF9tzn7UUIo" target="_blank" class="btn-game">
                🎮 JOGAR
            </a>

            <p>
                Enfrente chefes desafiadores em uma aventura inspirada nos desenhos animados dos anos 1930, com visual retrô e combates intensos.
            </p>

        </div>

    </section>

</body>
</html>
